services:
  # FastAPI backend API (includes daily scraper loop at 06:00 UTC)
  - type: web
    name: court-survivor-api
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/pw-browsers python -m playwright install chromium
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/pw-browsers
      - key: PYTHON_VERSION
        value: 3.12.10

  # React/Vite static frontend
  - type: web
    name: court-survivor-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
